name: Update Entitlements Data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DATA_REPO: ChiChou/entdb-data
  ENTDB_MIN_IOS_MAJOR: "18"

jobs:
  update:
    runs-on: macos-latest
    steps:
      - name: Free up disk space
        run: |
          # Remove Xcode and simulators in parallel (not needed for this workflow)
          sudo rm -rf /Applications/Xcode*.app &
          rm -rf ~/Library/Developer/CoreSimulator &
          rm -rf ~/Library/Developer/Xcode &
          wait
          df -h /

      - name: Checkout indexer
        uses: actions/checkout@v4

      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          path: entdb-data
          token: ${{ secrets.DATA_REPO_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build vfdecrypt (only for iOS < 10)
        if: ${{ fromJson(env.ENTDB_MIN_IOS_MAJOR) < 10 }}
        run: |
          cd vendor/vfdecrypt
          PREFIX=$(brew --prefix openssl@3)
          cc -o vfdecrypt vfdecrypt.c -lcrypto -I"$PREFIX/include" -L"$PREFIX/lib" -Wl,-rpath,"$PREFIX/lib" -Wno-deprecated-declarations
          cp vfdecrypt /usr/local/bin/

      - name: Install Python dependencies
        run: pip install pyhpke

      - name: Discover and process new entries
        run: python run.py

      - name: Commit and push
        working-directory: entdb-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "update: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            sleep $((i * 5))
          done
