name: Update Entitlements Data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DATA_REPO: ChiChou/entdb-data
  # Leave ENTDB_MIN_IOS_MAJOR unset so the floor comes from the single source of
  # truth in code (DEFAULT_MIN_IOS_MAJOR in stages/discover.py). Set it here (or
  # via workflow_dispatch) only to override the floor for a one-off backfill.

jobs:
  update:
    runs-on: macos-latest
    steps:
      - name: Checkout indexer
        uses: actions/checkout@v4

      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          path: entdb-data
          token: ${{ secrets.DATA_REPO_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build vfdecrypt (only for iOS < 10)
        # Defaults to 99 when the override is unset, so the build is skipped
        # unless a backfill run explicitly lowers the floor below 10.
        if: ${{ fromJson(env.ENTDB_MIN_IOS_MAJOR || '99') < 10 }}
        run: |
          cd vendor/vfdecrypt
          PREFIX=$(brew --prefix openssl@3)
          cc -o vfdecrypt vfdecrypt.c -lcrypto -I"$PREFIX/include" -L"$PREFIX/lib" -Wl,-rpath,"$PREFIX/lib" -Wno-deprecated-declarations
          cp vfdecrypt /usr/local/bin/

      - name: Install Python dependencies
        run: pip install pyhpke

      - name: Check runtime tools
        run: which codesign aea

      - name: Discover missing firmwares
        id: discover
        run: |
          FIRMWARE=$(python scripts/discover.py)
          if [ -z "$FIRMWARE" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "firmware=$FIRMWARE" >> $GITHUB_OUTPUT
          echo "group=$(echo $FIRMWARE | jq -r .group)" >> $GITHUB_OUTPUT
          echo "version=$(echo $FIRMWARE | jq -r .version)" >> $GITHUB_OUTPUT
          echo "build=$(echo $FIRMWARE | jq -r .build)" >> $GITHUB_OUTPUT
          echo "url=$(echo $FIRMWARE | jq -r .url)" >> $GITHUB_OUTPUT
          echo "beta=$(echo $FIRMWARE | jq -r '.beta // false')" >> $GITHUB_OUTPUT

      - name: Download IPSW
        if: steps.discover.outputs.skip != 'true'
        run: |
          echo "Downloading ${{ steps.discover.outputs.group }} ${{ steps.discover.outputs.version }}_${{ steps.discover.outputs.build }}"
          curl --fail -L -o firmware.ipsw "${{ steps.discover.outputs.url }}"
          ls -lh firmware.ipsw

      - name: Process IPSW
        if: steps.discover.outputs.skip != 'true'
        run: |
          python ipsw-db.py firmware.ipsw -o .
          ls -lh *.db

      - name: Export to data repo
        if: steps.discover.outputs.skip != 'true'
        run: |
          DB="${{ steps.discover.outputs.version }}_${{ steps.discover.outputs.build }}.db"
          BETA=""
          if [ "${{ steps.discover.outputs.beta }}" = "true" ]; then
            BETA="--beta"
          fi
          python scripts/export.py "$DB" "${{ steps.discover.outputs.group }}" $BETA

      - name: Commit and push
        working-directory: entdb-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "update: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            sleep $((i * 5))
          done
