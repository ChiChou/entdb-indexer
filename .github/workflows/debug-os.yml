name: Debug OS Info

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: macos-latest
    steps:
      - name: OS Information
        run: |
          echo "=== System Info ==="
          sw_vers
          uname -a

          echo ""
          echo "=== aea command ==="
          which aea || echo "aea not found in PATH"
          aea version 2>&1 || echo "aea version failed"

          echo ""
          echo "=== Disk Space ==="
          df -h

          echo ""
          echo "=== Runner Image Info ==="
          echo "ImageOS: $ImageOS"
          echo "ImageVersion: $ImageVersion"
